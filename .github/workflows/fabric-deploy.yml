# .github/workflows/fabric-deploy.yml
# Triggers only on test and main branches — NOT on dev

name: Fabric CI/CD Deploy

on:
  push:
    branches:
      - test
      - main
    paths:
      - 'fabric/**'

  workflow_dispatch:
    inputs:
      items_in_scope:
        description: 'Comma-separated list of Fabric item types to deploy. Remove any type to exclude it from this manual run.'
        required: false
        # Default value shown in the GitHub UI Run workflow form.
        # The person running it manually can edit this before clicking Run.
        default: 'Notebook,DataPipeline,Lakehouse,SemanticModel,Report,VariableLibrary,Environment,Dataflow,DataAgent,Warehouse,Ontology,SparkJobDefinition,Eventhouse,KQLDatabase,KQLQueryset,Eventstream,CopyJob,MirroredDatabase'

env:
  PYTHON_VERSION: '3.12'
  # Default items_in_scope for push trigger (not workflow_dispatch)
  # Default item types deployed on every AUTOMATIC push trigger.
  # This list is used when the workflow fires from a PR merge
  # (not from a manual workflow_dispatch run).
  # To permanently add or remove an item type, edit this list.
  DEFAULT_ITEMS: 'DataPipeline,Lakehouse,SemanticModel,Report,VariableLibrary,Environment,Dataflow,DataAgent,Warehouse,Ontology,SparkJobDefinition,Eventhouse,KQLDatabase,KQLQueryset,Eventstream,CopyJob,MirroredDatabase'

jobs:
  deploy:
    name: Deploy to Fabric
    runs-on: ubuntu-latest

    environment: >-
      ${{ github.ref_name == 'main' && 'production' || 'test' }}

    env:
      AZURE_TENANT_ID:     ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID:     ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      DEV_WORKSPACE_NAME:  ${{ vars.DEV_WORKSPACE_NAME }}
      TEST_WORKSPACE_NAME: ${{ vars.TEST_WORKSPACE_NAME }}
      PROD_WORKSPACE_NAME: ${{ vars.PROD_WORKSPACE_NAME }}
      GIT_DIRECTORY:       ${{ vars.GIT_DIRECTORY }}

    # ── Steps ────────────────────────────────────────────────
    steps:

      # Step 1 — Check out the repository
      # Downloads the repo contents to the runner so the
      # deploy script and fabric/ folder are accessible.
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 — Install Python
      # Sets up the specified Python version on the runner.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      # Step 3 — Install required Python packages
      # fabric-cicd  → Microsoft's official Fabric deployment library
      # azure-identity → handles Service Principal authentication
      # requests       → HTTP calls to Fabric REST API
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fabric-cicd azure-identity requests

      # Step 4 — Determine target environment
      # Sets TARGET_ENV based on which branch triggered the workflow.
      # This is then passed to the deploy script as --target_env.
      # The script uses TARGET_ENV to read the correct workspace name:
      #   test → reads TEST_WORKSPACE_NAME
      #   prod → reads PROD_WORKSPACE_NAME
      - name: Set target environment
        run: |
          if [ "${{ github.ref_name }}" == "main" ]; then
            echo "TARGET_ENV=prod" >> $GITHUB_ENV
          else
            echo "TARGET_ENV=test" >> $GITHUB_ENV
          fi

      # Step 5 — Run the deployment
      # Calls deploy-to-fabric.py with credentials and target env.
      # ITEMS_IN_SCOPE resolution:
      #   Manual run  → uses the value entered/kept in the GitHub UI form
      #   Push trigger → uses DEFAULT_ITEMS defined above
      - name: Deploy Fabric items
        env:
          ITEMS_IN_SCOPE: ${{ github.event.inputs.items_in_scope || env.DEFAULT_ITEMS }}
        run: |
          python .deploy/deploy-to-fabric.py \
            --aztenantid    "$AZURE_TENANT_ID" \
            --azclientid    "$AZURE_CLIENT_ID" \
            --azspsecret    "$AZURE_CLIENT_SECRET" \
            --target_env    "$TARGET_ENV" \
            --items_in_scope "$ITEMS_IN_SCOPE"

      # Step 6 — Write deployment summary
      # Appends a summary table to the GitHub Actions run page.
      # Visible under the run details in the Actions tab.
      - name: Deployment summary
        if: always()  # runs even if previous steps failed
        run: |
          echo '## Deployment Summary' >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Branch | ${{ github.ref_name }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Environment | $TARGET_ENV |" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ job.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Triggered by | ${{ github.actor }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit | ${{ github.sha }} |" >> $GITHUB_STEP_SUMMARY
